name: Web client CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared web packages
        run: >-
          pnpm --filter farcaster-analytics
          --filter farcaster-client-data
          --filter farcaster-cryptography
          --filter farcaster-cryptography-web
          --filter farcaster-client-hooks build
      - run: pnpm --dir apps/farcaster-web typecheck
      - run: pnpm --dir apps/farcaster-web test
      - run: pnpm --dir apps/farcaster-web build
